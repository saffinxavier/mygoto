<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>MyGoTo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --panel: #111111;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --line: #2a2a2a;
      --accent: #ffe600;
      --danger: #ff4d4d;
      --hard: 4px 4px 0 #000;
      --cat-skill: #ffe600;
      --cat-tool: #5ad4ff;
      --cat-ui-kit: #ff8a3d;
      --cat-guideline: #7dffb3;
      --cat-platform: #c9a0ff;
      --cat-security: #ff4d4d;
      --cat-automation: #ff7ad9;
      --header-offset: 12rem;
      --page-pad-x: clamp(12px, 2vw, 28px);
    }

    * { box-sizing: border-box; }

    html {
      scroll-padding-top: var(--header-offset);
    }

    body {
      margin: 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--text);
      line-height: 1.45;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 28px 28px;
      background-attachment: fixed;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 1680px;
      margin: 0 auto;
      padding: max(16px, env(safe-area-inset-top)) max(var(--page-pad-x), env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(var(--page-pad-x), env(safe-area-inset-left));
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 8px;
      background: var(--accent);
      color: #000;
      padding: 8px 12px;
      border: 2px solid #000;
      text-decoration: none;
      font-weight: 600;
      z-index: 1000;
    }
    .skip-link:focus { top: 8px; }

    .header-shell {
      margin-bottom: clamp(14px, 2vw, 18px);
    }

    .masthead,
    .toolbar {
      background: var(--panel);
      border: 2px solid var(--text);
      box-shadow: var(--hard);
    }

    .masthead {
      padding: clamp(12px, 1.6vw, 18px) clamp(12px, 1.5vw, 16px);
    }

    .toolbar {
      padding: clamp(10px, 1.4vw, 16px) clamp(12px, 1.5vw, 16px);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: border-color 80ms linear, box-shadow 80ms linear;
    }
    .toolbar.is-stuck {
      border-color: var(--accent);
      box-shadow: 4px 4px 0 var(--accent);
    }

    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px 16px;
    }

    .brand-block {
      min-width: 0;
      flex: 1 1 auto;
    }

    .brand {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5.5vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      text-wrap: balance;
      min-width: 0;
    }
    .brand span {
      display: inline-block;
      background: var(--accent);
      color: #000;
      padding: 0 0.12em;
      margin-left: 0.06em;
    }

    .sub {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(0.68rem, 1.4vw, 0.82rem);
      max-width: 36rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      min-width: 0;
    }

    .copy-list-btn {
      flex: 0 0 auto;
      border: 2px solid var(--text);
      background: #000;
      color: var(--text);
      border-radius: 0;
      padding: 8px 12px;
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 3px 3px 0 var(--text);
      min-height: 40px;
      align-self: flex-start;
    }
    .copy-list-btn:hover {
      background: #1a1a1a;
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--text);
    }
    .copy-list-btn:active {
      transform: translate(2px, 2px) scale(0.98);
    }
    .copy-list-btn.is-done {
      background: var(--accent);
      color: #000;
      border-color: #000;
      box-shadow: 3px 3px 0 #000;
    }

    .masthead-actions {
      display: none;
      margin-top: 12px;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
      align-items: stretch;
      min-width: 0;
    }

    .copy-prompt-btn,
    .filter-btn {
      border: 2px solid #000;
      background: var(--accent);
      color: #000;
      border-radius: 0;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 3px 3px 0 #000;
      min-height: 44px;
    }
    .filter-btn {
      display: none;
      background: #000;
      color: var(--text);
      border-color: var(--text);
      box-shadow: 3px 3px 0 var(--text);
      min-width: 5.5rem;
    }
    .filter-btn[aria-expanded="true"] {
      background: var(--accent);
      color: #000;
      border-color: #000;
      box-shadow: 3px 3px 0 #000;
    }
    .copy-prompt-btn:hover,
    .filter-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }
    .filter-btn:hover {
      box-shadow: 1px 1px 0 var(--text);
    }
    .filter-btn[aria-expanded="true"]:hover {
      box-shadow: 1px 1px 0 #000;
    }
    .copy-prompt-btn:active,
    .filter-btn:active {
      transform: translate(2px, 2px) scale(0.98);
    }
    .copy-prompt-btn.is-done {
      background: #fff;
    }

    input[type="search"] {
      width: 100%;
      border: 2px solid var(--text);
      border-radius: 0;
      padding: 12px 14px;
      background: #000;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
    }
    input[type="search"]::placeholder { color: #666; }

    input[type="search"]:focus-visible,
    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stats {
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0 0 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-variant-numeric: tabular-nums;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 100%;
    }

    .chip {
      border: 2px solid var(--text);
      background: #000;
      color: var(--text);
      border-radius: 0;
      padding: 7px 12px;
      font: inherit;
      font-size: clamp(0.68rem, 1.2vw, 0.75rem);
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: none;
      min-height: 40px;
    }
    .chip:hover { background: #1a1a1a; }
    .chip.active {
      background: var(--accent);
      color: #000;
      border-color: #000;
      box-shadow: 3px 3px 0 #000;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(12px, 1.4vw, 16px);
      width: 100%;
    }

    /* phone landscape / small tablet: 2 */
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    /* tablet: 3 */
    @media (min-width: 900px) {
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    /* desktop: 4, cards stretch with the wider shell */
    @media (min-width: 1200px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--text);
      border-left: 6px solid var(--cat, var(--text));
      border-radius: 0;
      padding: 14px;
      box-shadow: var(--hard);
      min-width: 0;
    }
    .card--enter {
      animation: cardIn 280ms steps(4, end) both;
    }
    .card:hover { border-left-color: var(--accent); }
    .card[data-cat="skill"] { --cat: var(--cat-skill); }
    .card[data-cat="tool"] { --cat: var(--cat-tool); }
    .card[data-cat="ui-kit"] { --cat: var(--cat-ui-kit); }
    .card[data-cat="guideline"] { --cat: var(--cat-guideline); }
    .card[data-cat="platform"] { --cat: var(--cat-platform); }
    .card[data-cat="security"] { --cat: var(--cat-security); }
    .card[data-cat="automation"] { --cat: var(--cat-automation); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--line);
    }
    .title {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
      text-wrap: balance;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .badge {
      white-space: nowrap;
      font-size: 0.65rem;
      padding: 4px 7px;
      border-radius: 0;
      border: 2px solid var(--text);
      color: var(--text);
      background: #000;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .summary {
      margin: 0 0 8px;
      font-size: 0.86rem;
    }
    .label {
      font-weight: 600;
      font-size: 0.72rem;
      color: var(--muted);
      margin-right: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .line {
      margin: 6px 0;
      font-size: 0.84rem;
      color: var(--text);
    }
    .note {
      margin-top: 8px;
      color: var(--danger);
      font-size: 0.78rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      font-size: 0.68rem;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 0;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .link-btn {
      text-decoration: none;
      background: var(--accent);
      color: #000;
      border: 2px solid #000;
      border-radius: 0;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-block;
      box-shadow: 3px 3px 0 #000;
    }
    .link-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    details {
      margin-top: 8px;
      border-top: 2px solid var(--line);
      padding-top: 8px;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "+ "; color: var(--accent); font-weight: 700; }
    details[open] summary::before { content: "− "; }

    code {
      font-family: inherit;
      font-size: 0.78rem;
      background: #000;
      border: 1px solid var(--line);
      padding: 1px 4px;
      word-break: break-all;
    }
    .code-with-copy {
      display: inline-flex;
      align-items: flex-start;
      gap: 4px;
      max-width: 100%;
      vertical-align: top;
    }
    .code-with-copy code {
      flex: 1;
      min-width: 0;
    }
    .copy-code-btn {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      margin: 0;
      padding: 0;
      border: 1px solid var(--line);
      background: #000;
      color: var(--muted);
      cursor: pointer;
      line-height: 0;
    }
    .copy-code-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    .copy-code-btn.is-done {
      color: var(--accent);
      border-color: var(--accent);
    }
    .copy-code-btn svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .empty {
      grid-column: 1 / -1;
      background: var(--panel);
      border: 2px dashed var(--muted);
      border-radius: 0;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.8rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .copy-prompt-btn:hover,
      .filter-btn:hover,
      .copy-list-btn:hover,
      .link-btn:hover {
        transform: none;
        box-shadow: 3px 3px 0 #000;
      }
      .filter-btn:hover { box-shadow: 3px 3px 0 var(--text); }
      .copy-list-btn:hover { box-shadow: 3px 3px 0 var(--text); }
      .filter-btn[aria-expanded="true"]:hover,
      .copy-list-btn.is-done:hover { box-shadow: 3px 3px 0 #000; }
      .copy-prompt-btn:active,
      .filter-btn:active,
      .copy-list-btn:active {
        transform: none;
      }
    }

    /* Desktop / tablet: one sticky chrome block */
    @media (min-width: 768px) {
      .header-shell {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--panel);
        border: 2px solid var(--text);
        box-shadow: var(--hard);
        padding: clamp(12px, 1.6vw, 18px) clamp(12px, 1.5vw, 16px) clamp(12px, 1.4vw, 16px);
        transition: border-color 80ms linear, box-shadow 80ms linear;
      }
      .header-shell.is-stuck {
        border-color: var(--accent);
        box-shadow: 4px 4px 0 var(--accent);
      }
      .masthead,
      .toolbar {
        background: transparent;
        border: 0;
        box-shadow: none;
        padding: 0;
        position: static;
      }
      .masthead { margin-bottom: clamp(10px, 1.5vw, 14px); }
      .toolbar { margin: 0; }
      .toolbar.is-stuck {
        border-color: transparent;
        box-shadow: none;
      }
      .search-wrap { margin-bottom: 10px; }
    }

    /* Mobile: masthead scrolls away; sticky = search + optional filters */
    @media (max-width: 767px) {
      .masthead {
        margin-bottom: 10px;
        padding: 12px;
      }
      .header-top {
        gap: 8px 10px;
      }
      .brand { font-size: 1.85rem; }
      .sub {
        width: 100%;
        max-width: none;
        margin-top: 6px;
        font-size: 0.68rem;
        line-height: 1.35;
      }
      .copy-list-btn {
        padding: 7px 10px;
        font-size: 0.62rem;
        min-height: 36px;
      }
      .masthead-actions { display: block; }
      .masthead-actions .copy-prompt-btn {
        width: 100%;
        white-space: normal;
      }
      .toolbar {
        padding: 8px 10px;
        margin-bottom: 0;
      }
      .search-wrap {
        grid-template-columns: 1fr auto;
        margin-bottom: 0;
      }
      .search-wrap .copy-prompt-btn { display: none; }
      .filter-btn { display: inline-flex; align-items: center; justify-content: center; }
      input[type="search"] {
        padding: 10px 12px;
        font-size: 1rem; /* avoid iOS zoom */
      }
      .stats {
        margin: 8px 0 0;
        font-size: 0.68rem;
      }
      .chips {
        display: none;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 2px solid var(--line);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .toolbar.is-filters-open .chips { display: grid; }
      .chip {
        width: 100%;
        text-align: center;
        min-height: 40px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#catalog">Skip to catalog</a>
  <div class="container">
    <header class="header-shell" id="header">
      <div class="masthead">
        <div class="header-top">
          <div class="brand-block">
            <h1 class="brand">My<span>GoTo</span></h1>
            <p class="sub">Skills · tools · UI kits · platforms. Plain English, pick fast.</p>
          </div>
          <button type="button" class="copy-list-btn" id="copy-list" aria-label="Copy all catalog names and links">Copy list</button>
        </div>
        <div class="masthead-actions">
          <button type="button" class="copy-prompt-btn" id="copy-prompt-mobile" aria-label="Copy project picker prompt">Copy project prompt</button>
        </div>
      </div>
      <div class="toolbar" id="toolbar">
        <div class="search-wrap">
          <input id="search" type="search" name="q" autocomplete="off" spellcheck="false" placeholder="Search name, use case, tag, source…" aria-label="Search catalog">
          <button type="button" class="copy-prompt-btn" id="copy-prompt" aria-label="Copy project picker prompt">Copy project prompt</button>
          <button type="button" class="filter-btn" id="filter-btn" aria-controls="chips" aria-expanded="false">Filters</button>
        </div>
        <p id="stats" class="stats" aria-live="polite"></p>
        <div class="chips" id="chips" role="toolbar" aria-label="Category filters"></div>
      </div>
    </header>
    <main id="catalog" class="grid" aria-label="Catalog cards"></main>
  </div>

  <script>

    ];

    const categories = [
      ["all", "All"],
      ["skill", "Skills"],
      ["tool", "Tools"],
      ["ui-kit", "UI Kits"],
      ["guideline", "Guidelines"],
      ["platform", "Platforms"],
      ["security", "Security"],
      ["automation", "Automation"]
    ];

    const state = {
      q: "",
      cat: "all"
    };
    let firstPaint = true;

    const searchInput = document.getElementById("search");
    const chipsEl = document.getElementById("chips");
    const catalogEl = document.getElementById("catalog");
    const statsEl = document.getElementById("stats");

    function parseHash() {
      const raw = location.hash.replace(/^#/, "");
      if (!raw) return;
      const p = new URLSearchParams(raw);
      const q = p.get("q");
      const cat = p.get("cat");
      if (q !== null) state.q = q;
      if (cat && categories.some(([id]) => id === cat)) state.cat = cat;
    }

    function writeHash() {
      const p = new URLSearchParams();
      if (state.q) p.set("q", state.q);
      if (state.cat !== "all") p.set("cat", state.cat);
      const h = p.toString();
      history.replaceState(null, "", h ? "#" + h : location.pathname);
    }

    function createChips() {
      chipsEl.innerHTML = "";
      categories.forEach(([id, label]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (state.cat === id ? " active" : "");
        btn.textContent = label;
        btn.setAttribute("aria-pressed", state.cat === id ? "true" : "false");
        btn.addEventListener("click", () => {
          state.cat = id;
          writeHash();
          createChips();
          renderCards();
          if (window.matchMedia("(max-width: 767px)").matches) {
            document.getElementById("toolbar").classList.remove("is-filters-open");
          }
          if (typeof syncFilterLabel === "function") syncFilterLabel();
          if (typeof syncHeaderOffset === "function") syncHeaderOffset();
        });
        chipsEl.appendChild(btn);
      });
    }

    function matches(entry, q) {
      if (!q) return true;
      const needle = q.toLowerCase().trim();
      const hay = [
        entry.name,
        entry.category,
        entry.summary,
        entry.useFor,
        entry.skipWhen,
        entry.link,
        ...(entry.tags || []),
        entry.sourceNote || "",
        entry.installHint || "",
        entry.cursorHow || ""
      ].join(" ").toLowerCase();
      return hay.includes(needle);
    }

    function renderCards() {
      const filtered = entries.filter((entry) => {
        const catOk = state.cat === "all" ? true : entry.category === state.cat;
        return catOk && matches(entry, state.q);
      });

      statsEl.textContent = filtered.length + " shown / " + entries.length + " total";
      catalogEl.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matches. Try a shorter search or pick a different category.";
        catalogEl.appendChild(empty);
        return;
      }

      filtered.forEach((entry, index) => {
        const card = document.createElement("article");
        card.className = "card" + (firstPaint ? " card--enter" : "");
        card.dataset.cat = entry.category;
        if (firstPaint) {
          card.style.animationDelay = Math.min(index, 16) * 35 + "ms";
        }

        const tags = (entry.tags || []).map((t) => "<span class=\"tag\">" + escapeHtml(t) + "</span>").join("");
        const note = entry.sourceNote ? "<p class=\"note\"><span class=\"label\">Note:</span>" + escapeHtml(entry.sourceNote) + "</p>" : "";
        const install = entry.installHint
          ? "<p class=\"line\"><span class=\"label\">Install:</span><span class=\"code-with-copy\"><code>" + escapeHtml(entry.installHint) + "</code>"
            + "<button type=\"button\" class=\"copy-code-btn\" aria-label=\"Copy install command\" title=\"Copy\">"
            + "<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"9\" y=\"9\" width=\"13\" height=\"13\"></rect><path d=\"M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1\"></path></svg>"
            + "</button></span></p>"
          : "";
        const how = entry.cursorHow ? "<p class=\"line\"><span class=\"label\">Cursor:</span>" + escapeHtml(entry.cursorHow) + "</p>" : "";
        const openLabel = "Open " + entry.name + " (opens in new tab)";

        card.innerHTML = ""
          + "<div class=\"top\">"
          + "<h2 class=\"title\">" + escapeHtml(entry.name) + "</h2>"
          + "<span class=\"badge\">" + escapeHtml(entry.category) + "</span>"
          + "</div>"
          + "<p class=\"summary\">" + escapeHtml(entry.summary) + "</p>"
          + "<p class=\"line\"><span class=\"label\">Use for:</span>" + escapeHtml(entry.useFor) + "</p>"
          + "<details>"
          + "<summary>More details</summary>"
          + "<p class=\"line\"><span class=\"label\">Skip when:</span>" + escapeHtml(entry.skipWhen) + "</p>"
          + install
          + how
          + note
          + "<div class=\"tags\">" + tags + "</div>"
          + "</details>"
          + "<div class=\"actions\">"
          + "<a class=\"link-btn\" href=\"" + escapeAttr(entry.link) + "\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"" + escapeAttr(openLabel) + "\">Open ↗</a>"
          + "</div>";
        catalogEl.appendChild(card);
      });

      firstPaint = false;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeAttr(value) {
      return String(value).replace(/"/g, "&quot;");
    }

    const COPY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="13" height="13"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>';
    const CHECK_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>';

    catalogEl.addEventListener("click", async (event) => {
      const btn = event.target.closest(".copy-code-btn");
      if (!btn || !catalogEl.contains(btn)) return;
      const codeEl = btn.previousElementSibling;
      if (!codeEl || codeEl.tagName !== "CODE") return;
      try {
        await navigator.clipboard.writeText(codeEl.textContent);
        btn.classList.add("is-done");
        btn.setAttribute("aria-label", "Copied");
        btn.innerHTML = CHECK_ICON;
        setTimeout(() => {
          btn.classList.remove("is-done");
          btn.setAttribute("aria-label", "Copy install command");
          btn.innerHTML = COPY_ICON;
        }, 1600);
      } catch (err) {
        btn.setAttribute("aria-label", "Copy failed");
      }
    });

    const PROJECT_PROMPT = `You are helping me set up THIS Cursor project using my personal MyGoTo catalog.

Catalog (live): https://saffinxavier.github.io/mygoto/
Fallback: https://github.com/saffinxavier/mygoto (open index.html) or local MyGoTo repo.

Do this:
1. Inspect this repo (README, package manifests, scripts, main folders, stack).
2. From the MyGoTo catalog, recommend ONLY 3–7 items that fit THIS project. Do not dump the whole catalog.
3. For each pick, give: name, category, why it fits here, exact Cursor how-to (from the card’s Cursor / Install fields), and when to skip.
4. Prefer: skills for agent workflow, tools/ui-kits for code deps, guidelines for UI audits. Skip unrelated platforms.
5. End with a short install order I can run in the terminal / Cursor Agent.

Keep answers short and action-first.`;

    const copyButtons = [
      document.getElementById("copy-prompt"),
      document.getElementById("copy-prompt-mobile")
    ].filter(Boolean);

    async function copyProjectPrompt(btn) {
      try {
        await navigator.clipboard.writeText(PROJECT_PROMPT);
        copyButtons.forEach((el) => {
          el.textContent = "Copied";
          el.classList.add("is-done");
        });
        setTimeout(() => {
          copyButtons.forEach((el) => {
            el.textContent = "Copy project prompt";
            el.classList.remove("is-done");
          });
        }, 1600);
      } catch (err) {
        btn.textContent = "Copy failed";
      }
    }
    copyButtons.forEach((btn) => {
      btn.addEventListener("click", () => copyProjectPrompt(btn));
    });

    function catalogNameLinkList() {
      return entries.map((entry) => `${entry.name}\n${entry.link}`).join("\n\n");
    }

    const copyListBtn = document.getElementById("copy-list");
    copyListBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(catalogNameLinkList());
        copyListBtn.textContent = "Copied";
        copyListBtn.classList.add("is-done");
        setTimeout(() => {
          copyListBtn.textContent = "Copy list";
          copyListBtn.classList.remove("is-done");
        }, 1600);
      } catch (err) {
        copyListBtn.textContent = "Copy failed";
      }
    });

    searchInput.addEventListener("input", (event) => {
      state.q = event.target.value;
      writeHash();
      renderCards();
    });

    const headerEl = document.getElementById("header");
    const toolbarEl = document.getElementById("toolbar");
    const filterBtn = document.getElementById("filter-btn");
    const mobileMq = window.matchMedia("(max-width: 767px)");

    function stickyEl() {
      return mobileMq.matches ? toolbarEl : headerEl;
    }

    function syncFilterLabel() {
      if (!filterBtn) return;
      const open = toolbarEl.classList.contains("is-filters-open");
      const catLabel = categories.find(([id]) => id === state.cat)?.[1] || "All";
      filterBtn.textContent = open ? "Close" : (state.cat === "all" ? "Filters" : catLabel);
      filterBtn.setAttribute("aria-expanded", open ? "true" : "false");
    }

    filterBtn.addEventListener("click", () => {
      toolbarEl.classList.toggle("is-filters-open");
      syncFilterLabel();
      syncHeaderOffset();
    });

    function syncHeaderOffset() {
      const el = stickyEl();
      document.documentElement.style.setProperty(
        "--header-offset",
        `${Math.ceil(el.getBoundingClientRect().height) + 12}px`
      );
    }
    function syncStuck() {
      const stuck = window.scrollY > 8;
      headerEl.classList.toggle("is-stuck", stuck && !mobileMq.matches);
      toolbarEl.classList.toggle("is-stuck", stuck && mobileMq.matches);
    }
    function onViewportChange() {
      if (!mobileMq.matches) {
        toolbarEl.classList.remove("is-filters-open");
      }
      syncFilterLabel();
      syncStuck();
      syncHeaderOffset();
    }
    window.addEventListener("scroll", syncStuck, { passive: true });
    if (mobileMq.addEventListener) mobileMq.addEventListener("change", onViewportChange);
    else mobileMq.addListener(onViewportChange);
    syncStuck();
    syncFilterLabel();
    syncHeaderOffset();
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(syncHeaderOffset).observe(toolbarEl);
      new ResizeObserver(syncHeaderOffset).observe(headerEl);
    } else {
      window.addEventListener("resize", syncHeaderOffset, { passive: true });
    }

    parseHash();
    searchInput.value = state.q;
    createChips();
    renderCards();
    syncFilterLabel();
    syncHeaderOffset();

    if (!mobileMq.matches) searchInput.focus();
  </script>
</body>
</html>
