<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyGoTo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0a;
      --panel: #111111;
      --text: #f2f2f2;
      --muted: #8a8a8a;
      --line: #2a2a2a;
      --accent: #ffe600;
      --danger: #ff4d4d;
      --hard: 4px 4px 0 #000;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Mono", ui-monospace, monospace;
      color: var(--text);
      line-height: 1.45;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 28px 28px;
      background-attachment: fixed;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 8px;
      background: var(--accent);
      color: #000;
      padding: 8px 12px;
      border: 2px solid #000;
      text-decoration: none;
      font-weight: 600;
      z-index: 1000;
    }
    .skip-link:focus { top: 8px; }

    .header {
      background: var(--panel);
      border: 2px solid var(--text);
      box-shadow: var(--hard);
      padding: 18px 16px 16px;
      margin-bottom: 18px;
      position: sticky;
      top: 0;
      z-index: 10;
      transition: border-color 80ms linear, box-shadow 80ms linear;
    }
    .header.is-stuck {
      border-color: var(--accent);
      box-shadow: 4px 4px 0 var(--accent);
    }

    .brand {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      line-height: 0.92;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }
    .brand span {
      display: inline-block;
      background: var(--accent);
      color: #000;
      padding: 0 0.12em;
      margin-left: 0.06em;
    }

    .sub {
      margin: 10px 0 16px;
      color: var(--muted);
      font-size: 0.82rem;
      max-width: 42rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .search-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-bottom: 10px;
      align-items: stretch;
    }

    .copy-prompt-btn {
      border: 2px solid #000;
      background: var(--accent);
      color: #000;
      border-radius: 0;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 3px 3px 0 #000;
    }
    .copy-prompt-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }
    .copy-prompt-btn.is-done {
      background: #fff;
    }

    input[type="search"] {
      width: 100%;
      border: 2px solid var(--text);
      border-radius: 0;
      padding: 12px 14px;
      background: #000;
      color: var(--text);
      font: inherit;
      font-size: 0.9rem;
    }
    input[type="search"]::placeholder { color: #666; }

    input[type="search"]:focus-visible,
    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .stats {
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0 0 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 2px solid var(--text);
      background: #000;
      color: var(--text);
      border-radius: 0;
      padding: 7px 12px;
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      transition: none;
    }
    .chip:hover { background: #1a1a1a; }
    .chip.active {
      background: var(--accent);
      color: #000;
      border-color: #000;
      box-shadow: 3px 3px 0 #000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border: 2px solid var(--text);
      border-left: 6px solid var(--text);
      border-radius: 0;
      padding: 14px;
      box-shadow: var(--hard);
      animation: cardIn 280ms steps(4, end) both;
    }
    .card:hover { border-left-color: var(--accent); }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: flex-start;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--line);
    }
    .title {
      margin: 0;
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .badge {
      white-space: nowrap;
      font-size: 0.65rem;
      padding: 4px 7px;
      border-radius: 0;
      border: 2px solid var(--text);
      color: var(--text);
      background: #000;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }

    .summary {
      margin: 0 0 8px;
      font-size: 0.86rem;
    }
    .label {
      font-weight: 600;
      font-size: 0.72rem;
      color: var(--muted);
      margin-right: 6px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .line {
      margin: 6px 0;
      font-size: 0.84rem;
      color: var(--text);
    }
    .note {
      margin-top: 8px;
      color: var(--danger);
      font-size: 0.78rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .tag {
      font-size: 0.68rem;
      border: 1px solid var(--line);
      color: var(--muted);
      border-radius: 0;
      padding: 2px 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .link-btn {
      text-decoration: none;
      background: var(--accent);
      color: #000;
      border: 2px solid #000;
      border-radius: 0;
      padding: 8px 12px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-block;
      box-shadow: 3px 3px 0 #000;
    }
    .link-btn:hover {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #000;
    }

    details {
      margin-top: 8px;
      border-top: 2px solid var(--line);
      padding-top: 8px;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      list-style: none;
    }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "+ "; color: var(--accent); font-weight: 700; }
    details[open] summary::before { content: "− "; }

    code {
      font-family: inherit;
      font-size: 0.78rem;
      background: #000;
      border: 1px solid var(--line);
      padding: 1px 4px;
      word-break: break-all;
    }

    .empty {
      grid-column: 1 / -1;
      background: var(--panel);
      border: 2px dashed var(--muted);
      border-radius: 0;
      padding: 28px;
      color: var(--muted);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.8rem;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
      .link-btn:hover {
        transform: none;
        box-shadow: 3px 3px 0 #000;
      }
    }

    @media (max-width: 600px) {
      .brand { font-size: 2.35rem; }
      .header { top: 0; }
    }
  </style>
</head>

    <main id="catalog" class="grid" aria-label="Catalog cards"></main>

    ];

    const categories = [
      ["all", "All"],
      ["skill", "Skills"],
      ["tool", "Tools"],
      ["ui-kit", "UI Kits"],
      ["guideline", "Guidelines"],
      ["platform", "Platforms"],
      ["security", "Security"],
      ["automation", "Automation"]
    ];

    const state = {
      q: "",
      cat: "all"
    };

    const searchInput = document.getElementById("search");
    const chipsEl = document.getElementById("chips");
    const catalogEl = document.getElementById("catalog");
    const statsEl = document.getElementById("stats");

    function parseHash() {
      const raw = location.hash.replace(/^#/, "");
      if (!raw) return;
      const p = new URLSearchParams(raw);
      const q = p.get("q");
      const cat = p.get("cat");
      if (q !== null) state.q = q;
      if (cat && categories.some(([id]) => id === cat)) state.cat = cat;
    }

    function writeHash() {
      const p = new URLSearchParams();
      if (state.q) p.set("q", state.q);
      if (state.cat !== "all") p.set("cat", state.cat);
      const h = p.toString();
      history.replaceState(null, "", h ? "#" + h : location.pathname);
    }

    function createChips() {
      chipsEl.innerHTML = "";
      categories.forEach(([id, label]) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (state.cat === id ? " active" : "");
        btn.textContent = label;
        btn.setAttribute("aria-pressed", state.cat === id ? "true" : "false");
        btn.addEventListener("click", () => {
          state.cat = id;
          writeHash();
          createChips();
          renderCards();
        });
        chipsEl.appendChild(btn);
      });
    }

    function matches(entry, q) {
      if (!q) return true;
      const needle = q.toLowerCase().trim();
      const hay = [
        entry.name,
        entry.category,
        entry.summary,
        entry.useFor,
        entry.skipWhen,
        entry.link,
        ...(entry.tags || []),
        entry.sourceNote || "",
        entry.installHint || "",
        entry.cursorHow || ""
      ].join(" ").toLowerCase();
      return hay.includes(needle);
    }

    function renderCards() {
      const filtered = entries.filter((entry) => {
        const catOk = state.cat === "all" ? true : entry.category === state.cat;
        return catOk && matches(entry, state.q);
      });

      statsEl.textContent = filtered.length + " shown / " + entries.length + " total";
      catalogEl.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No matches. Try a shorter search or pick a different category.";
        catalogEl.appendChild(empty);
        return;
      }

      filtered.forEach((entry, index) => {
        const card = document.createElement("article");
        card.className = "card";
        card.style.animationDelay = Math.min(index, 16) * 35 + "ms";

        const tags = (entry.tags || []).map((t) => "<span class=\"tag\">" + escapeHtml(t) + "</span>").join("");
        const note = entry.sourceNote ? "<p class=\"note\"><span class=\"label\">Note:</span>" + escapeHtml(entry.sourceNote) + "</p>" : "";
        const install = entry.installHint ? "<p class=\"line\"><span class=\"label\">Install:</span><code>" + escapeHtml(entry.installHint) + "</code></p>" : "";
        const how = entry.cursorHow ? "<p class=\"line\"><span class=\"label\">Cursor:</span>" + escapeHtml(entry.cursorHow) + "</p>" : "";

        card.innerHTML = ""
          + "<div class=\"top\">"
          + "<h2 class=\"title\">" + escapeHtml(entry.name) + "</h2>"
          + "<span class=\"badge\">" + escapeHtml(entry.category) + "</span>"
          + "</div>"
          + "<p class=\"summary\">" + escapeHtml(entry.summary) + "</p>"
          + "<p class=\"line\"><span class=\"label\">Use for:</span>" + escapeHtml(entry.useFor) + "</p>"
          + "<details>"
          + "<summary>More details</summary>"
          + "<p class=\"line\"><span class=\"label\">Skip when:</span>" + escapeHtml(entry.skipWhen) + "</p>"
          + install
          + how
          + note
          + "<div class=\"tags\">" + tags + "</div>"
          + "</details>"
          + "<div class=\"actions\">"
          + "<a class=\"link-btn\" href=\"" + escapeAttr(entry.link) + "\" target=\"_blank\" rel=\"noopener noreferrer\">Open link</a>"
          + "</div>";
        catalogEl.appendChild(card);
      });
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function escapeAttr(value) {
      return String(value).replace(/"/g, "&quot;");
    }

    const PROJECT_PROMPT = `You are helping me set up THIS Cursor project using my personal MyGoTo catalog.

Catalog (live): https://saffinxavier.github.io/mygoto/
Fallback: https://github.com/saffinxavier/mygoto (open index.html) or local MyGoTo repo.

Do this:
1. Inspect this repo (README, package manifests, scripts, main folders, stack).
2. From the MyGoTo catalog, recommend ONLY 3–7 items that fit THIS project. Do not dump the whole catalog.
3. For each pick, give: name, category, why it fits here, exact Cursor how-to (from the card’s Cursor / Install fields), and when to skip.
4. Prefer: skills for agent workflow, tools/ui-kits for code deps, guidelines for UI audits. Skip unrelated platforms.
5. End with a short install order I can run in the terminal / Cursor Agent.

Keep answers short and action-first.`;

    const copyPromptBtn = document.getElementById("copy-prompt");
    copyPromptBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(PROJECT_PROMPT);
        copyPromptBtn.textContent = "Copied";
        copyPromptBtn.classList.add("is-done");
        setTimeout(() => {
          copyPromptBtn.textContent = "Copy project prompt";
          copyPromptBtn.classList.remove("is-done");
        }, 1600);
      } catch (err) {
        copyPromptBtn.textContent = "Copy failed";
      }
    });

    searchInput.addEventListener("input", (event) => {
      state.q = event.target.value;
      writeHash();
      renderCards();
    });

    const headerEl = document.getElementById("header");
    function syncStuck() {
      headerEl.classList.toggle("is-stuck", window.scrollY > 8);
    }
    window.addEventListener("scroll", syncStuck, { passive: true });
    syncStuck();

    parseHash();
    searchInput.value = state.q;
    createChips();
    renderCards();

    const isDesktop = window.matchMedia("(min-width: 768px)").matches;
    if (isDesktop) searchInput.focus();
  </script>
</body>
</html>
